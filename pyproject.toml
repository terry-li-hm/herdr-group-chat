[project]
name = "herdr-group-chat"
version = "0.11.0"
description = "A Herdr plugin for shared local rooms of full native AI coding agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "regex>=2024.11.6",
  "wcwidth>=0.2.13",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["assays"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"assays/*" = ["S101"]
"assays/test_release_smoke.py" = ["S101", "S603"]
# The bootstrap executes only argv-based Herdr commands and its adjacent checked-in effector.
"new-room" = ["S603", "S606"]
# The smoke harness executes only argv-based Herdr and Git commands, never the room relay directly.
"release-smoke" = ["S603", "S606"]
# The adapter executes only argv-based Orca commands and its adjacent checked-in effector.
"orca-group-chat" = ["S101", "S603", "S606"]
