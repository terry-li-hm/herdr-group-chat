id = "terry.herdr-group-chat"
name = "Herdr Group Chat"
version = "0.12.0"
min_herdr_version = "0.8.0"
description = "A shared local room for full native AI coding agents managed by Herdr."
platforms = ["macos", "linux"]

[[actions]]
id = "new"
title = "New group chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch", "--profile", "astra-fable-grok-pi"]

[[actions]]
id = "new-astra-fable"
title = "New Astra + Fable chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch", "--profile", "astra-fable"]

[[actions]]
id = "new-astra-fable-grok-native"
title = "New Astra + Fable + Grok native chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch", "--profile", "astra-fable-grok"]

[[actions]]
id = "new-astra-fable-glm"
title = "New Astra + Fable + GLM chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch", "--profile", "astra-fable-glm"]

[[actions]]
id = "new-classic"
title = "New classic four-agent chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch"]

[[actions]]
id = "open"
title = "Open group chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--open"]

[[actions]]
id = "adopt-peers"
title = "Adopt stale group-chat peers"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--adopt-peers"]

[[panes]]
id = "new-room"
title = "New group chat"
placement = "tab"
command = ["./new-room"]

[[panes]]
id = "room"
title = "Group chat"
placement = "tab"
command = ["./new-room", "--room-entrypoint"]
