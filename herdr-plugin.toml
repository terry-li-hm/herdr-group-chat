id = "terry.herdr-group-chat"
name = "Herdr Group Chat"
version = "0.4.1"
min_herdr_version = "0.8.0"
description = "A shared local room for full native AI coding agents managed by Herdr."
platforms = ["macos", "linux"]

[[actions]]
id = "new"
title = "New group chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch"]

[[actions]]
id = "new-sol-fable"
title = "New Sol + Fable chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--launch", "--profile", "sol-fable"]

[[actions]]
id = "open"
title = "Open group chat"
contexts = ["workspace", "tab", "pane"]
command = ["./new-room", "--open"]

[[panes]]
id = "new-room"
title = "New group chat"
placement = "tab"
command = ["./new-room"]

[[panes]]
id = "room"
title = "Group chat"
placement = "tab"
command = ["./new-room", "--room-entrypoint"]
